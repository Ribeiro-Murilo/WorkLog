name: Windows Desktop

on:
  pull_request:
    paths:
      - "desktop-windows/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main
    paths:
      - "desktop-windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Windows App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  package-windows:
    name: Package Windows (.exe)
    runs-on: windows-latest
    needs: validate
    defaults:
      run:
        working-directory: desktop-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-windows/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: worklog-windows
          path: |
            desktop-windows/release/*.exe
            desktop-windows/release/*.blockmap
            desktop-windows/release/latest.yml
          if-no-files-found: warn
